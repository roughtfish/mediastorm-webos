<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>mediastorm</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>
<div id="view"></div>

<div id="prep">
  <div id="prep-art"></div>
  <div id="prep-text">
    <div id="prep-title"></div>
    <div id="prep-status"></div>
    <ul id="prep-attempts"></ul>
  </div>
  <div id="prep-hint">Press Back to cancel</div>
</div>

<div id="player">
  <video id="video" preload="auto"></video>
  <div id="spinner"></div>
  <div id="osd-note"></div>
  <div id="osd">
    <div id="osd-title"></div>
    <div id="osd-sub"></div>
    <div id="osd-audio"></div>
    <div id="osd-source"></div>
    <div id="osd-release"></div>
    <div class="osd-bar"><i id="osd-bar"></i><b id="osd-scrub"></b></div>
    <div class="osd-foot"><span id="osd-time"></span><span class="osd-hint">Left/right to move, OK to jump. Down for audio and subtitles, Up for cast</span></div>
  </div>
  <div id="subs"></div>
  <div id="skip-btn">Skip intro</div>
  <div id="upnext">
    <div id="upnext-label">Up next</div>
    <div id="upnext-ep"></div>
    <div id="upnext-count"></div>
    <div id="upnext-hint">OK to play now, Back to stop</div>
  </div>
  <div id="cast-strip"><h3 id="cast-strip-title">Cast</h3><div class="row-track" id="cast-strip-track"></div></div>
  <div id="audio-menu">
    <div id="audio-list"></div>
  </div>
</div>

<div id="toast"></div>

<script src="config.js"></script>
<script src="js/util.js"></script>
<script src="js/api.js"></script>
<script src="js/nav.js"></script>
<script src="js/player.js"></script>
<script src="js/app.js"></script>
</body>
</html>
